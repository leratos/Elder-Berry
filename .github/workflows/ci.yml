name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          # web-Gruppe enthaelt seit Phase 78 markdown-it-py + bleach,
          # die der MarkdownRenderer fuer das Vorschlaege-Dashboard
          # importiert. Ohne web-Gruppe scheitern test_markdown_renderer
          # und test_proposals_api beim Sammeln.
          #
          # Phase 99 (CI-Ehrlichkeit): matrix/documents/nextcloud/memory
          # ergaenzt, damit die bisher per importorskip/skipif uebersprungenen
          # Tests (matrix_channel, carddav, document_reader, memory_store; ~172)
          # real laufen. matrix_channel.py importiert nio top-level -> ohne die
          # matrix-Gruppe hatte der PRIMAERE Nutzerkanal strukturell 0%
          # Patch-Coverage. Der security-Job installiert dieselben Gruppen
          # bereits auf Linux -> Installierbarkeit ist belegt. avatar/stt/
          # tts-neural/tower bleiben absichtlich aussen vor (Display/System-
          # Abhaengigkeiten); jene Tests bleiben gewollt geskippt.
          pip install -e ".[robot,agent,web,matrix,documents,nextcloud,memory]"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: pip install -e ".[windows]"

      - name: Run tests
        run: >-
          python -m pytest tests/ -v --tb=short
          --cov=src/elder_berry --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        # Nur einmal hochladen (Linux). Windows-Run schickt sonst
        # einen zweiten Report mit identischem Stand und doppelt sich
        # in der Codecov-UI.
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff (blockierende Rules)
        # Phase 99 (CI-Ehrlichkeit): Ruleset + Scope leben jetzt zentral in
        # pyproject.toml ([tool.ruff.lint]) -- keine Flag-Duplikation mehr
        # zwischen CI, pre-commit und pyproject. Regeln: E9 (Syntax), F (volle
        # Pyflakes-Familie, vorher nur F401), W605 (ungueltige Escapes),
        # B (Bugbear; B008 ignoriert fuer FastAPI File/Form/Body). Scope um
        # scripts/ + tower/ erweitert (verifiziert clean). server/ enthaelt
        # keine .py-Dateien.
        run: ruff check src/ tests/ scripts/ tower/

  typecheck:
    # Phase 76 + 76c: hartes Gate. Alle core/-, tools/- und web/-Module
    # sind strict getypt; ein Type-Fehler scheitert die Pipeline.
    # Phase 105-A: agent/ kommt strict dazu (netz-exponierter Laptop-Tier).
    # Phase 105-B1: robot/-Trivial-Module strict (Rest noch ignore_errors).
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + mypy + Stubs
        # Project-Deps werden gebraucht, damit mypy httpx/cryptography/
        # keyring/caldav/google-* etc. korrekt typisieren kann (sonst
        # werden Returns zu Any). dev + alle tools/-Gruppen, damit
        # 76c-strict-Module die echten Stubs sehen.
        # Phase 105-A: agent-Gruppe ergaenzt -- agent/server.py nutzt numpy
        # (np.iinfo-Typvar) + sounddevice; ohne numpy (eigene Stubs) wuerde
        # der strict-Lauf an import-not-found scheitern, bevor die
        # Annotationen geprueft werden.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tools,nextcloud,web,documents,agent]"

      - name: Type-check core/+tools/+web/+comms/+agent/+robot/+avatar/
        # Phase 107: avatar/ ist jetzt strict (EmotionLayers vereinheitlicht,
        # LayerSource read-only) und rpi5_avatar aus dem ignore_errors-Block
        # geloest -> robot/ ist vollstaendig strict. pygame/PIL sind via
        # ignore_missing_imports gedeckt, daher kein avatar-Install-Extra noetig.
        run: mypy src/elder_berry/core src/elder_berry/tools src/elder_berry/web src/elder_berry/comms src/elder_berry/agent src/elder_berry/robot src/elder_berry/avatar

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        # Alle sicheren optionalen Gruppen installieren, damit pip-audit
        # möglichst viele transitive Dependencies prüfen kann.
        # Gruppen mit System-Abhängigkeiten (windows, tts-neural, stt,
        # avatar, tower) werden explizit ausgelassen.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[robot,agent,matrix,remote,memory,tools,documents,nextcloud,web,harmony]"

      - name: Audit dependencies for known vulnerabilities
        # CVE-2026-3219: pip verarbeitet concatenated tar/ZIP-Archive
        # mehrdeutig. Betrifft nur Installation aus lokal praeparierten
        # Archiven; pip install von PyPI ist nicht angreifbar. Kein Fix
        # released (Fix Versions leer im Advisory). Wiederbewerten sobald
        # eine gepatchte pip-Version verfuegbar ist.
        #
        # CVE-2026-45829: Pre-Auth Code-Injection im ChromaDB-HTTP-Server
        # (Endpoint /api/v2/.../collections) bei trust_remote_code=true.
        # Elder-Berry nutzt ChromaDB ausschliesslich eingebettet via
        # chromadb.PersistentClient (lokal, in-process) -- der HTTP-Server
        # wird nie gestartet, HttpClient/trust_remote_code nirgends
        # verwendet. Kein Fix released (Fix Versions leer im Advisory;
        # 1.5.9 ist die aktuellste PyPI-Version). Wiederbewerten sobald
        # eine gepatchte chromadb-Version verfuegbar ist.
        run: >-
          pip-audit --desc on
          --ignore-vuln CVE-2026-3219
          --ignore-vuln CVE-2026-45829
