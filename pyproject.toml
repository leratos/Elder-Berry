    "elder_berry.avatar.lip_sync",
    "elder_berry.avatar.render_plan",
    "elder_berry.avatar.sprite_renderer",
    "elder_berry.avatar.state_machine",
]
strict = true

# --- Phase 105-B1 strict: robot/ trivial-Module ---
# client/server/alexa_skill_handler folgen in B2; rpi5_avatar spaeter
# (avatar/-Kopplung). Beide bleiben solange im ignore_errors-Block oben.
[[tool.mypy.overrides]]
module = [
    "elder_berry.robot",                        # __init__.py
    "elder_berry.robot.protocol",
    "elder_berry.robot.harmony_layout_manager",
    "elder_berry.robot.simulator",
    "elder_berry.robot.turntable_controller",
    "elder_berry.robot.harmony_scene_manager",
    "elder_berry.robot.camera_controller",
    "elder_berry.robot.harmony_adapter",
]
strict = true

# --- Phase 105-B2a/B2b strict: robot/ core (client + alexa + server) ---
# Phase 107: rpi5_avatar ergaenzt -- avatar/ ist jetzt strict, die
# EmotionLayers/LayerSource-Kopplung (frueher 182) ist aufgeloest. Damit ist
# robot/ vollstaendig strict (kein ignore_errors-Modul mehr).
[[tool.mypy.overrides]]
module = [
    "elder_berry.robot.client",
    "elder_berry.robot.alexa_skill_handler",
    "elder_berry.robot.server",
    "elder_berry.robot.rpi5_avatar",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
# Phase 55.2 – jeder Test wird nach 60s zwangsweise abgebrochen. Fängt
# Hänger durch echte Syscalls (SendMessageTimeoutW, Netzwerk, Display)
# früh ab, statt den ganzen Run zu blockieren. Einzelne Tests dürfen
# mit @pytest.mark.timeout(n) einen höheren Wert setzen.
timeout = 60
timeout_method = "thread"
