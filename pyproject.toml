# --- Phase 107 strict: avatar/-Paket ---
# Loest avatar.* aus dem ignore_errors-Block oben. EmotionLayers ist ab 107
# vereinheitlicht (avatar_config_loader, von layered_renderer re-exportiert);
# LayerSource-Protocol read-only (@property), sodass frozen-Dataclasses es
# erfuellen. rpi5_avatar folgt in 107-Etappe 3 (war 105-Restposten).
[[tool.mypy.overrides]]
module = [
    "elder_berry.avatar",                       # __init__.py
    "elder_berry.avatar.attention",
    "elder_berry.avatar.avatar_config_loader",
    "elder_berry.avatar.base",
    "elder_berry.avatar.briefing_mode",
    "elder_berry.avatar.controller",
    "elder_berry.avatar.crossfade_benchmark",
    "elder_berry.avatar.idle_policy",
